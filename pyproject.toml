[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdastro"
version = "0.1.0"
description = "Future Disclosure: Astronomy — open, testable tools for finding discoveries hidden in public astronomy data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Future Disclosure contributors" }]
keywords = ["astronomy", "interstellar objects", "exoplanets", "orbit determination", "education", "citizen science"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/utahisnotastate/ufwwaragainstearthsstars"
Documentation = "https://github.com/utahisnotastate/ufwwaragainstearthsstars/tree/main/docs"
Issues = "https://github.com/utahisnotastate/ufwwaragainstearthsstars/issues"

[project.optional-dependencies]
archives = ["astropy>=5.3", "astroquery>=0.4.7", "lightkurve>=2.4"]
test = ["pytest>=7.4"]

[project.scripts]
fdastro = "fdastro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
